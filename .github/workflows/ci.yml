# CI 门禁:格式 + 静态检查 + 单测/覆盖率 + 镜像构建(规范 05 最小门禁)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装检查依赖
        run: pip install -r requirements-dev.txt
      - name: 格式检查
        run: ruff format --check .
      - name: 静态检查
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 单元测试与覆盖率
        run: pytest --cov=app --cov-fail-under=80 -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建镜像(验证 Dockerfile 可构建)
        run: docker build -t banksys_sy_lixiaohua:ci .
